services:
  - type: worker
    name: melbourne-visa-monitor-2026-11
    runtime: docker
    rootDir: tools/visa-monitor
    plan: 1c-2g
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    disk:
      name: visa-observations
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MONITOR_ENABLED
        value: "false"
      - key: TARGET_MONTH
        value: "2026-11"
      - key: INTERVAL_SECONDS
        value: "60"
      - key: DURATION_HOURS
        value: "24"
      - key: DATA_DIR
        value: /data
